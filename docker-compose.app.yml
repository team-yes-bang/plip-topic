# 순수 서비스 전용 설정으로,
# 인프라 의존성(`mysql` 등)을 최소화한 순수 애플리케이션 컨테이너 정의 파일입니다.
# Develop 통합 환경 및 로컬에서 docker-compose 실행 시 이 파일을 `include` 해 사용합니다.

services:
  topic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plip-service-topic
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: plip_topic
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://mongo:27017/plip_topic}
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:-http://eureka-server:8761/eureka/}
      EUREKA_INSTANCE_HOSTNAME: topic
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
    networks:
      - plip-net
