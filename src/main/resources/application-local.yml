server:
  # 충돌 시 SERVER_PORT env로 오버라이드 (YAML보다 우선)
  port: ${SERVER_PORT:8804}

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/plip_topic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  instance:
    prefer-ip-address: false
    hostname: localhost
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
