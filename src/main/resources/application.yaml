spring:
  application:
    name: topic
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: topic-service

app:
  kafka:
    topics:
      video-uploaded: video.uploaded
      diary-video-bound: diary.video.bound
      topic-created: topic.created
      topic-bound: topic.bound
      topic-started: topic.started
      topic-unbound: topic.unbound
      topic-video-attached: topic.video.attached

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true

eureka:
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
