name: Deploy to Develop PC

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

  trigger-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Verify DEVELOP_ENV_PAT
        env:
          DEVELOP_ENV_PAT: ${{ secrets.DEVELOP_ENV_PAT }}
        run: |
          if [ -z "$DEVELOP_ENV_PAT" ]; then
            echo "::error::DEVELOP_ENV_PAT is empty. Grant the org secret to plip-topic (Settings → Secrets and variables → Actions), or ask infra to add this repo to the secret's selected repositories."
            exit 1
          fi

      - name: Trigger develop PC deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEVELOP_ENV_PAT }}
          repository: team-yes-bang/plip-develop-env
          event-type: deploy-service
          client-payload: |
            {
              "service": "topic",
              "sha": "${{ github.sha }}",
              "repo": "${{ github.repository }}"
            }
