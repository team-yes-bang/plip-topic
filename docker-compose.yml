# 로컬에서 도커로 개발할 때 사용하는 파일입니다.
# 순수 서비스 전용 docker-compose.app.yml 파일을 `include`합니다.
# 서비스 외 도커로 띄울 인프라 등은 이곳에 설정합니다.

include:
  - docker-compose.app.yml

networks:
  plip-net:
    driver: bridge

services:
  mysql:
    image: mysql:8.4
    container_name: plip-topic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-plip_topic}
    ports:
      - "3308:3306"
    volumes:
      - plip_topic_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - plip-net

  redis:
    image: redis:7-alpine
    container_name: plip-topic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - plip-net

  kafka:
    image: apache/kafka:3.8.0
    container_name: plip-topic-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - plip-net

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: plip-topic-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - plip-net

  # 만약 로컬에서 앱을 실행할 때 의존성(Eureka 연동 등)이 필요없다면, 다음 주석을 해제하세요.
  # topic:
  #   depends_on: !reset
  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     EUREKA_CLIENT_ENABLED: "false"
  #   ports:
  #     - "${SERVER_PORT:-8804}:8080"

volumes:
  plip_topic_mysql_data:
